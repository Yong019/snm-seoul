<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep No More Mckithan — Casting Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --dark: #111111;
  --panel: #161616;
  --surface: #1c1c1c;
  --border: #2a2a2a;
  --border-light: #333;
  --muted: #555;
  --dim: #888;
  --text: #c8c4bc;
  --bright: #e8e2d8;
  --white: #f2ede6;
  --gold: #b89a5e;
  --gold-dim: #7a6438;
  --red: #8b3a3a;
  --red-bright: #c45c5c;
  --teal: #3a6b6b;
  --teal-bright: #5aacac;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--black);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  font-weight:300;
  font-size:14px;
  line-height:1.7;
  min-height:100vh;
}
::selection{background:var(--gold-dim);color:var(--white)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--border-light)}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  height:56px;
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;font-weight:300;letter-spacing:0.12em;
  color:var(--white);
  display:flex;align-items:center;gap:12px;
  cursor:default;user-select:none;
}
.logo span{color:var(--gold);font-style:italic}
.header-right{display:flex;align-items:center;gap:16px}
.sync-status{
  font-family:'DM Mono',monospace;
  font-size:11px;color:var(--dim);
  display:flex;align-items:center;gap:6px;
}
.sync-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--muted);
  transition:background .3s;
}
.sync-dot.live{background:#4caf50;box-shadow:0 0 6px #4caf5088;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-settings{
  background:none;border:1px solid var(--border);
  color:var(--dim);cursor:pointer;
  padding:5px 12px;border-radius:2px;
  font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:0.08em;
  transition:all .2s;
}
.btn-settings:hover{border-color:var(--gold);color:var(--gold)}

/* ── NAV TABS ── */
.nav-wrap{
  background:var(--dark);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  display:flex;gap:0;overflow-x:auto;
}
.nav-wrap::-webkit-scrollbar{height:0}
.nav-tab{
  background:none;border:none;cursor:pointer;
  color:var(--muted);
  font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:0.1em;text-transform:uppercase;
  padding:14px 18px;
  border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;
}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ── LAYOUT ── */
.main{padding:28px 24px;max-width:1200px;margin:0 auto}

/* ── HERO STATS ── */
.hero-stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;
  background:var(--border);
  border:1px solid var(--border);
  margin-bottom:28px;
}
.stat-cell{
  background:var(--dark);
  padding:20px 20px 16px;
}
.stat-cell .num{
  font-family:'Cormorant Garamond',serif;
  font-size:42px;font-weight:300;
  color:var(--white);line-height:1;
  margin-bottom:4px;
}
.stat-cell .num.gold{color:var(--gold)}
.stat-cell .lbl{
  font-family:'DM Mono',monospace;
  font-size:10px;color:var(--muted);
  letter-spacing:0.12em;text-transform:uppercase;
}

/* ── SECTION TITLE ── */
.sec-title{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:300;font-style:italic;
  color:var(--bright);
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:baseline;gap:12px;
}
.sec-title small{
  font-family:'DM Mono',monospace;
  font-size:10px;font-style:normal;
  color:var(--muted);letter-spacing:0.1em;
}

/* ── SEARCH + FILTER ── */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-input{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:7px 12px;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;
  border-radius:2px;outline:none;
  flex:1;min-width:160px;
  transition:border-color .2s;
}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:var(--gold-dim)}
select.filter-sel{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:7px 10px;
  font-family:'DM Mono',monospace;font-size:11px;
  border-radius:2px;outline:none;cursor:pointer;
}
select.filter-sel:focus{border-color:var(--gold-dim)}

/* ── ACTOR GRID ── */
.actor-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:1px;background:var(--border);
}
.actor-card{
  background:var(--dark);
  padding:16px 18px;
  cursor:pointer;
  transition:background .15s;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:8px;
}
.actor-card:hover{background:var(--panel)}
.actor-card.checkout{opacity:.65}
.actor-name{
  font-size:15px;font-weight:400;color:var(--bright);
  margin-bottom:3px;
}
.actor-meta{
  font-family:'DM Mono',monospace;
  font-size:10px;color:var(--muted);
  line-height:1.6;
}
.actor-count{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;font-weight:300;color:var(--gold);
  line-height:1;flex-shrink:0;
}
.actor-count.checkout-count{color:var(--muted)}

/* ── BADGES ── */
.badge{
  display:inline-block;
  font-family:'DM Mono',monospace;
  font-size:9px;letter-spacing:0.08em;
  padding:2px 6px;border-radius:1px;
  margin-left:6px;vertical-align:middle;
}
.badge-out{background:var(--red);color:#ffd0d0}
.badge-mile{background:var(--gold-dim);color:var(--white)}
.badge-new{background:var(--teal);color:#b0e8e8}

/* ── DETAIL PANEL ── */
.detail-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:flex-end;
}
.detail-overlay.open{display:flex}
.detail-panel{
  background:var(--dark);
  border-left:1px solid var(--border);
  width:min(480px,100vw);height:100vh;
  overflow-y:auto;
  padding:24px;
  animation:slideIn .25s ease;
}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.detail-close{
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:20px;
  float:right;padding:4px;
  transition:color .2s;
}
.detail-close:hover{color:var(--white)}
.detail-actor-name{
  font-family:'Cormorant Garamond',serif;
  font-size:36px;font-weight:300;
  color:var(--white);margin-bottom:4px;
}
.detail-sub{
  font-family:'DM Mono',monospace;font-size:11px;
  color:var(--dim);margin-bottom:20px;
}
.detail-section{margin-bottom:20px}
.detail-section h4{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:0.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
}
.checkin-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:16px;
}
.checkin-cell{
  background:var(--panel);
  border:1px solid var(--border);
  padding:12px 14px;
}
.checkin-cell .ci-label{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px;
}
.checkin-cell .ci-date{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;font-weight:300;color:var(--bright);
}
.checkin-cell .ci-num{
  font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);
}
.milestone-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.milestone-chip{
  background:var(--panel);border:1px solid var(--gold-dim);
  padding:4px 10px;
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--gold);
}
.role-bar-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:7px;font-size:12px;
}
.role-bar-name{width:90px;color:var(--text);flex-shrink:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-bar-track{flex:1;height:3px;background:var(--border);position:relative}
.role-bar-fill{height:100%;background:var(--gold-dim);transition:width .5s ease}
.role-bar-n{
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--muted);min-width:28px;text-align:right;
}

/* ── ROLE TABLE ── */
.role-block{
  border:1px solid var(--border);
  margin-bottom:12px;
}
.role-block-header{
  background:var(--panel);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;
}
.role-block-header:hover{background:var(--surface)}
.role-block-title{
  font-size:14px;font-weight:500;color:var(--bright);
}
.role-block-total{
  font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);
}
.role-actors-list{padding:8px 0;display:none}
.role-actors-list.open{display:block}
.role-actor-row{
  display:flex;align-items:center;
  padding:6px 16px;
  border-top:1px solid var(--border);
  gap:10px;
}
.role-actor-row:first-child{border-top:none}
.role-actor-bar{flex:1;height:2px;background:var(--border)}
.role-actor-bar-fill{height:100%;background:var(--teal)}
.role-actor-n{
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--muted);min-width:32px;text-align:right;
}

/* ── MILESTONE TABLE ── */
.mile-table{width:100%;border-collapse:collapse}
.mile-table th{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);text-align:left;
  padding:8px 12px;border-bottom:1px solid var(--border);
}
.mile-table td{
  padding:8px 12px;font-size:13px;
  border-bottom:1px solid var(--border);
}
.mile-table tr:last-child td{border-bottom:none}
.mile-table tr:hover td{background:var(--panel)}
.mile-n{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:300;color:var(--gold);
}

/* ── MY LOG ── */
.mylog-wrap{}
.mylog-input-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mylog-input-row input,.mylog-input-row select{
  background:var(--panel);border:1px solid var(--border);
  color:var(--text);padding:7px 10px;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;
  border-radius:2px;outline:none;
}
.mylog-input-row input:focus,.mylog-input-row select:focus{border-color:var(--gold-dim)}
.btn-add{
  background:var(--gold-dim);border:none;cursor:pointer;
  color:var(--white);padding:7px 16px;
  font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:0.08em;border-radius:2px;
  transition:background .2s;white-space:nowrap;
}
.btn-add:hover{background:var(--gold)}
.mylog-list{}
.mylog-item{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--border);gap:8px;
}
.mylog-item:last-child{border-bottom:none}
.mylog-perf{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;font-weight:300;color:var(--gold);
  min-width:36px;
}
.mylog-info{flex:1}
.mylog-date{font-size:13px;color:var(--bright)}
.mylog-memo{font-size:11px;color:var(--muted);margin-top:2px}
.mylog-del{
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:16px;padding:2px 6px;
  transition:color .2s;
}
.mylog-del:hover{color:var(--red-bright)}
.mylog-actor-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mylog-actor-chip{
  background:var(--panel);border:1px solid var(--border);
  padding:2px 8px;
  font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);
}

/* ── MY STATS ── */
.my-stats-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:12px;margin-bottom:20px;
}
.my-stat-card{
  background:var(--panel);border:1px solid var(--border);
  padding:14px 16px;
}
.my-stat-card .n{
  font-family:'Cormorant Garamond',serif;
  font-size:34px;font-weight:300;color:var(--bright);line-height:1;
}
.my-stat-card .l{
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;
  margin-top:4px;
}

/* ── SETTINGS MODAL ── */
.modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.8);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--dark);border:1px solid var(--border);
  width:min(520px,100%);
  padding:28px;
  animation:fadeUp .2s ease;
}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-title{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;font-weight:300;
  color:var(--white);margin-bottom:20px;
}
.modal-label{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;display:block;
}
.modal-input{
  width:100%;background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);padding:9px 12px;
  font-family:'DM Mono',monospace;font-size:12px;
  border-radius:2px;outline:none;margin-bottom:16px;
}
.modal-input:focus{border-color:var(--gold-dim)}
.modal-hint{
  font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6;
}
.modal-hint code{
  background:var(--panel);padding:1px 5px;
  font-family:'DM Mono',monospace;font-size:11px;
  color:var(--teal-bright);border:1px solid var(--border);
}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{
  background:none;border:1px solid var(--border);
  color:var(--dim);cursor:pointer;
  padding:7px 16px;font-family:'DM Mono',monospace;font-size:11px;
  transition:all .2s;border-radius:2px;
}
.btn-cancel:hover{border-color:var(--border-light);color:var(--text)}
.btn-save{
  background:var(--gold-dim);border:none;cursor:pointer;
  color:var(--white);padding:7px 20px;
  font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:0.08em;border-radius:2px;
  transition:background .2s;
}
.btn-save:hover{background:var(--gold)}

/* ── LOADING / EMPTY ── */
.loading{
  text-align:center;padding:60px 20px;
  font-family:'DM Mono',monospace;font-size:11px;
  color:var(--muted);letter-spacing:0.12em;
}
.loading .spin{
  display:block;width:20px;height:20px;
  border:1px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;margin:0 auto 16px;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{
  text-align:center;padding:40px 20px;
  color:var(--muted);font-size:13px;
}

/* ── TABS CONTENT ── */
.tab-content{display:none}
.tab-content.active{display:block}

/* ── SCHEDULE VIEW ── */
.perf-list{}
.perf-row{
  display:flex;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--border);
  gap:14px;font-size:13px;
  cursor:pointer;transition:color .15s;
}
.perf-row:hover{color:var(--white)}
.perf-num{
  font-family:'DM Mono',monospace;font-size:11px;
  color:var(--muted);min-width:36px;
}
.perf-date{color:var(--bright);min-width:90px}
.perf-time{
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--muted);min-width:24px;
}
.perf-actors{
  display:flex;flex-wrap:wrap;gap:4px;flex:1;
}
.perf-chip{
  background:var(--panel);
  font-size:11px;color:var(--dim);
  padding:1px 7px;
}
.perf-mine{
  font-family:'DM Mono',monospace;font-size:9px;
  color:var(--teal-bright);border:1px solid var(--teal);
  padding:1px 6px;flex-shrink:0;
}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .main{padding:16px 14px}
  header{padding:0 14px}
  .nav-wrap{padding:0 14px}
  .actor-grid{grid-template-columns:1fr}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .detail-panel{width:100vw}
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logoBtn">Sleep No More <span>Mckithan</span></div>
  <div class="header-right">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncText">—</span>
    </div>
    <button class="btn-settings" onclick="openSettings()" style="opacity:0;pointer-events:none;position:absolute">⚙ 설정</button>
  </div>
</header>

<div class="nav-wrap">
  <button class="nav-tab active" onclick="showTab('overview')">개요</button>
  <button class="nav-tab" onclick="showTab('actors')">배우</button>
  <button class="nav-tab" onclick="showTab('roles')">역할</button>
  <button class="nav-tab" onclick="showTab('milestones')">기념 공연</button>
  <button class="nav-tab" onclick="showTab('schedule')">일정</button>
  <button class="nav-tab" onclick="showTab('mylog')">내 기록</button>
</div>

<main class="main">

  <!-- OVERVIEW -->
  <div class="tab-content active" id="tab-overview">
    <div class="hero-stats" id="heroStats">
      <div class="stat-cell"><div class="num gold" id="statTotal">—</div><div class="lbl">총 회차</div></div>
      <div class="stat-cell"><div class="num" id="statActive">—</div><div class="lbl">활동 배우</div></div>
      <div class="stat-cell"><div class="num" id="statCheckout">—</div><div class="lbl">체크아웃</div></div>
      <div class="stat-cell"><div class="num" id="statRoles">—</div><div class="lbl">역할 수</div></div>
      <div class="stat-cell"><div class="num" id="statMine">—</div><div class="lbl">내가 본 공연</div></div>
    </div>
    <div class="sec-title">출연 순위 <small>TOP 15</small></div>
    <div id="overviewChart"></div>
  </div>

  <!-- ACTORS -->
  <div class="tab-content" id="tab-actors">
    <div class="filter-row">
      <input class="search-input" id="actorSearch" placeholder="배우 이름 검색..." oninput="renderActors()">
      <select class="filter-sel" id="actorSort" onchange="renderActors()">
        <option value="count">출연 횟수 순</option>
        <option value="name">이름 순</option>
        <option value="first">첫 공연 순</option>
      </select>
      <select class="filter-sel" id="actorFilter" onchange="renderActors()">
        <option value="all">전체</option>
        <option value="active">활동 중</option>
        <option value="checkout">체크아웃</option>
      </select>
    </div>
    <div class="actor-grid" id="actorGrid"></div>
  </div>

  <!-- ROLES -->
  <div class="tab-content" id="tab-roles">
    <div class="filter-row">
      <input class="search-input" id="roleSearch" placeholder="역할 검색..." oninput="renderRoles()" style="max-width:280px">
    </div>
    <div id="roleList"></div>
  </div>

  <!-- MILESTONES -->
  <div class="tab-content" id="tab-milestones">
    <div class="filter-row">
      <select class="filter-sel" id="mileTarget" onchange="renderMilestones()">
        <option value="50">50회</option>
        <option value="100" selected>100회</option>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <!-- Password gate -->
    <div id="pwGate">
      <div class="modal-title">관리자 확인</div>
      <label class="modal-label">비밀번호</label>
      <input class="modal-input" id="pwInput" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPw()">
      <div id="pwError" style="color:var(--red-bright);font-size:12px;margin-bottom:12px;display:none">비밀번호가 틀렸습니다</div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">취소</button>
        <button class="btn-save" onclick="checkPw()">확인</button>
      </div>
    </div>
    <!-- Actual settings (hidden until pw correct) -->
    <div id="pwContent" style="display:none">
      <div class="modal-title">설정</div>
      <label class="modal-label">Google Spreadsheet ID</label>
      <input class="modal-input" id="sheetIdInput" placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms">
      <div class="modal-hint">
        스프레드시트 URL에서 <code>/d/</code>와 <code>/edit</code> 사이의 문자열을 입력하세요.<br>
        시트는 <b>링크가 있는 모든 사용자 → 뷰어</b> 권한으로 설정해야 합니다.<br><br>
        필요한 시트: <code>캐스팅 기록</code>, <code>배우 정보</code>
      </div>
      <label class="modal-label">시트 이름 (캐스팅)</label>
      <input class="modal-input" id="castSheetName" placeholder="캐스팅 기록">
      <label class="modal-label">시트 이름 (배우 정보)</label>
      <input class="modal-input" id="actorSheetName" placeholder="배우 정보">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">취소</button>
        <button class="btn-save" onclick="saveSettings()">저장 & 불러오기</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let CFG = {
  sheetId: localStorage.getItem('snm_sheetId') || '',
  castSheet: localStorage.getItem('snm_castSheet') || '캐스팅 기록',
  actorSheet: localStorage.getItem('snm_actorSheet') || '배우 정보',
};
let DATA = null;        // processed data
let MY_LOG = JSON.parse(localStorage.getItem('snm_mylog') || '[]');

// ══════════════════════════════════════════════
//  FETCH & PROCESS
// ══════════════════════════════════════════════
async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  const txt = await res.text();
  const json = JSON.parse(txt.slice(47, -2));
  const cols = json.table.cols.map(c => c.label);
  return json.table.rows
    .map(r => {
      const obj = {};
      cols.forEach((h, i) => {
        const cell = r.c[i];
        obj[h] = cell ? (cell.v !== null && cell.v !== undefined ? String(cell.v) : '') : '';
      });
      return obj;
    })
    .filter(r => Object.values(r).some(v => String(v).trim()));
}

function processData(castRows, actorRows) {
  // Checkout set
  const checkoutSet = new Set();
  actorRows.forEach(r => {
    const name = Object.values(r)[0]?.trim();
    const status = Object.values(r)[1]?.trim();
    if (name && status === '체크아웃') checkoutSet.add(name);
  });

  // Performances map: perfNum → {num, date, time, cast:[{role,actor}]}
  const perfs = {};
  // Actor stats
  const actorCounts = {};      // actor → total unique perfs
  const actorRoles = {};       // actor → {role → count}
  const actorPerfNums = {};    // actor → sorted [perfNum]
  const roleCasts = {};        // role → {actor → count}
  const perfDates = {};        // perfNum → {date, time}

  castRows.forEach(r => {
    const num = parseInt(r['회차번호'] || r[Object.keys(r)[0]]);
    const date = (r['날짜'] || r[Object.keys(r)[1]] || '').trim();
    const time = (r['시간대'] || r[Object.keys(r)[2]] || '').trim();
    const role = (r['역할'] || r[Object.keys(r)[3]] || '').trim();
    const actor = (r['배우'] || r[Object.keys(r)[4]] || '').trim();
    if (!actor || !role || !num) return;

    if (!perfs[num]) perfs[num] = { num, date, time, cast: [] };
    perfs[num].cast.push({ role, actor });
    perfDates[num] = { date, time };

    if (!actorRoles[actor]) actorRoles[actor] = {};
    actorRoles[actor][role] = (actorRoles[actor][role] || 0) + 1;

    if (!actorPerfNums[actor]) actorPerfNums[actor] = new Set();
    actorPerfNums[actor].add(num);

    if (!roleCasts[role]) roleCasts[role] = {};
    roleCasts[role][actor] = (roleCasts[role][actor] || 0) + 1;
  });

  // Count unique perfs per actor
  Object.entries(actorPerfNums).forEach(([actor, nums]) => {
    actorCounts[actor] = nums.size;
  });

  // First/last perf per actor
  const actorFirstLast = {};
  Object.entries(actorPerfNums).forEach(([actor, numsSet]) => {
    const sorted = [...numsSet].sort((a, b) => a - b);
    const first = sorted[0], last = sorted[sorted.length - 1];
    actorFirstLast[actor] = {
      firstNum: first, firstDate: perfDates[first]?.date, firstTime: perfDates[first]?.time,
      lastNum: last, lastDate: perfDates[last]?.date, lastTime: perfDates[last]?.time,
    };
  });

  // Milestones per actor
  const milestones = {};
  Object.entries(actorPerfNums).forEach(([actor, numsSet]) => {
    const sorted = [...numsSet].sort((a, b) => a - b);
    milestones[actor] = {};
    [50, 100, 150, 200, 250, 300].forEach(n => {
      if (sorted.length >= n) {
        const pNum = sorted[n - 1];
        milestones[actor][n] = { perfNum: pNum, date: perfDates[pNum]?.date, time: perfDates[pNum]?.time };
      }
    });
  });

  return {
    perfs, actorCounts, actorRoles, actorPerfNums,
    actorFirstLast, roleCasts, checkoutSet, milestones, perfDates,
    totalPerfs: Object.keys(perfs).length,
  };
}

async function loadData() {
  if (!CFG.sheetId) return;
  setSyncStatus('loading');
  try {
    const [castRows, actorRows] = await Promise.all([
      fetchSheet(CFG.castSheet),
      fetchSheet(CFG.actorSheet),
    ]);
    DATA = processData(castRows, actorRows);
    setSyncStatus('live');
    renderAll();
  } catch (e) {
    setSyncStatus('error');
    console.error(e);
  }
}

// ══════════════════════════════════════════════
//  RENDER ALL
// ══════════════════════════════════════════════
function renderAll() {
  renderOverview();
  renderActors();
  renderRoles();
  renderMilestones();
  renderSchedule();
  renderMyLog();
}

// ── OVERVIEW ──
function renderOverview() {
  if (!DATA) return;
  const { totalPerfs, actorCounts, checkoutSet, roleCasts } = DATA;
  const active = Object.keys(actorCounts).filter(a => !checkoutSet.has(a)).length;
  document.getElementById('statTotal').textContent = totalPerfs;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statCheckout').textContent = checkoutSet.size;
  document.getElementById('statRoles').textContent = Object.keys(roleCasts).length;
  document.getElementById('statMine').textContent = MY_LOG.length;

  const sorted = Object.entries(actorCounts).sort((a, b) => b[1] - a[1]).slice(0, 15);
  const max = sorted[0]?.[1] || 1;
  let html = '';
  sorted.forEach(([actor, cnt]) => {
    const pct = Math.round(cnt / max * 100);
    const out = checkoutSet.has(actor);
    html += `<div class="role-bar-row" style="margin-bottom:10px">
      <div class="role-bar-name" style="width:80px;font-size:13px;color:${out?'var(--muted)':'var(--bright)'}">${actor}</div>
      <div class="role-bar-track" style="height:4px">
        <div class="role-bar-fill" style="width:${pct}%;background:${out?'var(--muted)':'var(--gold-dim)'}"></div>
      </div>
      <div class="role-bar-n">${cnt}</div>
    </div>`;
  });
  document.getElementById('overviewChart').innerHTML = html;
}

// ── ACTORS ──
function renderActors() {
  if (!DATA) return;
  const { actorCounts, actorFirstLast, checkoutSet } = DATA;
  const q = document.getElementById('actorSearch').value.trim().toLowerCase();
  const sort = document.getElementById('actorSort').value;
  const filter = document.getElementById('actorFilter').value;

  let list = Object.entries(actorCounts).filter(([a]) => {
    if (q && !a.toLowerCase().includes(q)) return false;
    if (filter === 'active' && checkoutSet.has(a)) return false;
    if (filter === 'checkout' && !checkoutSet.has(a)) return false;
    return true;
  });

  if (sort === 'count') list.sort((a, b) => b[1] - a[1]);
  else if (sort === 'name') list.sort((a, b) => a[0].localeCompare(b[0], 'ko'));
  else list.sort((a, b) => (actorFirstLast[a[0]]?.firstNum||999) - (actorFirstLast[b[0]]?.firstNum||999));

  if (!list.length) {
    document.getElementById('actorGrid').innerHTML = '<div class="empty">검색 결과 없음</div>';
    return;
  }

  document.getElementById('actorGrid').innerHTML = list.map(([actor, cnt]) => {
    const fl = actorFirstLast[actor] || {};
    const out = checkoutSet.has(actor);
    return `<div class="actor-card${out?' checkout':''}" onclick="showActorDetail('${actor.replace(/'/g,"\\'")}')">
      <div>
        <div class="actor-name">${actor}${out?'<span class="badge badge-out">OUT</span>':''}</div>
        <div class="actor-meta">
          첫 공연 ${fl.firstDate||'—'} ${fl.firstTime||''}<br>
          ${out?`막공 ${fl.lastDate||'—'} ${fl.lastTime||''}`:
                `최근 ${fl.lastDate||'—'} ${fl.lastTime||''}`}
        </div>
      </div>
      <div class="actor-count${out?' checkout-count':''}">${cnt}</div>
    </div>`;
  }).join('');
}

// ── ACTOR DETAIL ──
function showActorDetail(actor) {
  if (!DATA) return;
  const { actorCounts, actorRoles, actorFirstLast, checkoutSet, milestones } = DATA;
  const cnt = actorCounts[actor] || 0;
  const fl = actorFirstLast[actor] || {};
  const out = checkoutSet.has(actor);
  const roles = actorRoles[actor] || {};
  const ms = milestones[actor] || {};
  const maxRole = Math.max(...Object.values(roles), 1);

  const mychips = Object.entries(ms).sort((a,b)=>a[0]-b[0]).map(([n,m]) =>
    `<div class="milestone-chip">${n}회 · ${m.date} ${m.time}</div>`
  ).join('');

  const roleBars = Object.entries(roles).sort((a,b)=>b[1]-a[1]).map(([role,n])=>
    `<div class="role-bar-row">
      <div class="role-bar-name">${role}</div>
      <div class="role-bar-track"><div class="role-bar-fill" style="width:${Math.round(n/maxRole*100)}%"></div></div>
      <div class="role-bar-n">${n}</div>
    </div>`
  ).join('');

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-actor-name">${actor}</div>
    <div class="detail-sub">총 ${cnt}회 출연${out?' · 체크아웃':''}</div>
    <div class="checkin-row">
      <div class="checkin-cell">
        <div class="ci-label">체크인 · 첫 공연</div>
        <div class="ci-date">${fl.firstDate||'—'}</div>
        <div class="ci-num">제${fl.firstNum||'?'}회 ${fl.firstTime||''}</div>
      </div>
      <div class="checkin-cell">
        <div class="ci-label">${out?'체크아웃 · 막공':'최근 공연'}</div>
        <div class="ci-date">${fl.lastDate||'—'}</div>
        <div class="ci-num">제${fl.lastNum||'?'}회 ${fl.lastTime||''}</div>
      </div>
    </div>
    ${mychips ? `<div class="detail-section"><h4>기념 공연</h4><div class="milestone-chips">${mychips}</div></div>` : ''}
    <div class="detail-section"><h4>역할별 출연</h4>${roleBars}</div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('detailOverlay')) return;
  document.getElementById('detailOverlay').classList.remove('open');
}

// ── ROLES ──
function renderRoles() {
  if (!DATA) return;
  const { roleCasts } = DATA;
  const q = document.getElementById('roleSearch').value.trim().toLowerCase();
  const roles = Object.entries(roleCasts)
    .filter(([r]) => !q || r.toLowerCase().includes(q))
    .sort((a, b) => a[0].localeCompare(b[0], 'ko'));

  document.getElementById('roleList').innerHTML = roles.map(([role, actors]) => {
    const sorted = Object.entries(actors).sort((a,b)=>b[1]-a[1]);
    const total = sorted.reduce((s,[,c])=>s+c,0);
    const maxN = sorted[0]?.[1] || 1;
    const rows = sorted.map(([actor,n])=>
      `<div class="role-actor-row">
        <span style="min-width:80px;font-size:13px;color:var(--bright)">${actor}</span>
        <div class="role-actor-bar"><div class="role-actor-bar-fill" style="width:${Math.round(n/maxN*100)}%"></div></div>
        <span class="role-actor-n">${n}회</span>
      </div>`
    ).join('');
    return `<div class="role-block">
      <div class="role-block-header" onclick="toggleRole(this)">
        <span class="role-block-title">${role}</span>
        <span class="role-block-total">${sorted.length}명 · 총 ${total}회</span>
      </div>
      <div class="role-actors-list">${rows}</div>
    </div>`;
  }).join('');
}

function toggleRole(el) {
  el.nextElementSibling.classList.toggle('open');
}

// ── MILESTONES ──
function renderMilestones() {
  if (!DATA) return;
  const { milestones, checkoutSet } = DATA;
  const n = parseInt(document.getElementById('mileTarget').value);
  const list = Object.entries(milestones)
    .filter(([,ms]) => ms[n])
    .sort((a,b) => a[1][n].perfNum - b[1][n].perfNum);

  if (!list.length) {
    document.getElementById('milestoneTable').innerHTML = `<div class="empty">${n}회 달성 배우가 없습니다</div>`;
    return;
  }

  const rows = list.map(([actor, ms], i) => {
    const m = ms[n];
    const out = checkoutSet.has(actor);
    return `<tr>
      <td style="color:var(--muted);font-family:'DM Mono',monospace;font-size:11px">${i+1}</td>
      <td style="font-size:14px;color:${out?'var(--muted)':'var(--bright)'}">${actor}${out?'<span class="badge badge-out">OUT</span>':''}</td>
      <td class="mile-n">${n}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--dim)">${m.date}</td>
      <td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">${m.time||''}</td>
      <td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">제${m.perfNum}회</td>
    </tr>`;
  }).join('');

  document.getElementById('milestoneTable').innerHTML = `
    <table class="mile-table">
      <thead><tr><th>#</th><th>배우</th><th>기념회차</th><th>날짜</th><th>시간</th><th>회차</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── SCHEDULE ──
function renderSchedule() {
  if (!DATA) return;
  const { perfs } = DATA;
  const q = (document.getElementById('schedSearch').value || '').trim().toLowerCase();
  const filter = document.getElementById('schedFilter').value;
  const mySet = new Set(MY_LOG.map(l => l.perfNum));

  let list = Object.values(perfs).sort((a,b) => b.num - a.num);
  if (filter === 'mine') list = list.filter(p => mySet.has(p.num));
  if (q) list = list.filter(p =>
    p.date?.includes(q) || p.cast.some(c => c.actor.toLowerCase().includes(q) || c.role.includes(q))
  );

  if (!list.length) {
    document.getElementById('perfList').innerHTML = '<div class="empty">공연 없음</div>';
    return;
  }

  document.getElementById('perfList').innerHTML = list.slice(0, 200).map(p => {
    const isMine = mySet.has(p.num);
    // deduplicate actors
    const actors = [...new Set(p.cast.map(c => c.actor))];
    const chips = actors.slice(0,8).map(a => `<span class="perf-chip">${a}</span>`).join('');
    return `<div class="perf-row" onclick="toggleMyLogFromSchedule(${p.num})">
      <span class="perf-num">${p.num}</span>
      <span class="perf-date">${p.date}</span>
      <span class="perf-time">${p.time}</span>
      <div class="perf-actors">${chips}</div>
      ${isMine ? '<span class="perf-mine">✓ 내 기록</span>' : ''}
    </div>`;
  }).join('');
}

function toggleMyLogFromSchedule(perfNum) {
  const idx = MY_LOG.findIndex(l => l.perfNum === perfNum);
  if (idx >= 0) {
    MY_LOG.splice(idx, 1);
  } else if (DATA?.perfs[perfNum]) {
    const p = DATA.perfs[perfNum];
    MY_LOG.push({ perfNum, date: p.date, time: p.time, memo: '' });
  }
  saveMyLog();
  renderSchedule();
  renderMyLog();
  document.getElementById('statMine').textContent = MY_LOG.length;
}

// ── MY LOG ──
function addMyLog() {
  const numInput = document.getElementById('logPerf');
  const memoInput = document.getElementById('logMemo');
  const num = parseInt(numInput.value);
  if (!num || num < 1) return;
  if (MY_LOG.find(l => l.perfNum === num)) {
    alert('이미 기록된 회차입니다.');
    return;
  }
  const perf = DATA?.perfs[num];
  MY_LOG.push({
    perfNum: num,
    date: perf?.date || '',
    time: perf?.time || '',
    memo: memoInput.value.trim(),
  });
  MY_LOG.sort((a,b) => b.perfNum - a.perfNum);
  saveMyLog();
  numInput.value = '';
  memoInput.value = '';
  renderMyLog();
  renderSchedule();
  document.getElementById('statMine').textContent = MY_LOG.length;
}

function deleteMyLog(perfNum) {
  MY_LOG = MY_LOG.filter(l => l.perfNum !== perfNum);
  saveMyLog();
  renderMyLog();
  renderSchedule();
  document.getElementById('statMine').textContent = MY_LOG.length;
}

function saveMyLog() {
  localStorage.setItem('snm_mylog', JSON.stringify(MY_LOG));
}

function renderMyLog() {
  document.getElementById('myLogCount').textContent = MY_LOG.length + '회';

  // My stats
  if (DATA && MY_LOG.length) {
    const myNums = new Set(MY_LOG.map(l => l.perfNum));
    // actor freq in my logs
    const myActors = {};
    const myRoles = {};
    myNums.forEach(n => {
      const p = DATA.perfs[n];
      if (!p) return;
      const seen = new Set();
      p.cast.forEach(({ role, actor }) => {
        if (!seen.has(actor)) { seen.add(actor); myActors[actor] = (myActors[actor]||0)+1; }
        myRoles[role] = (myRoles[role]||0)+1;
      });
    });
    const topActors = Object.entries(myActors).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const topRoles = Object.entries(myRoles).sort((a,b)=>b[1]-a[1]).slice(0,5);
    document.getElementById('myStatsGrid').innerHTML = `
      <div class="my-stat-card"><div class="n">${MY_LOG.length}</div><div class="l">내가 본 공연</div></div>
      <div class="my-stat-card"><div class="n">${Object.keys(myActors).length}</div><div class="l">만난 배우</div></div>
      <div class="my-stat-card" style="grid-column:span 2">
        <div class="l" style="margin-bottom:8px">자주 본 배우</div>
        ${topActors.map(([a,n])=>`<span style="font-size:13px;color:var(--bright);margin-right:12px">${a} <span style="color:var(--gold);font-family:'DM Mono',monospace;font-size:11px">${n}</span></span>`).join('')}
      </div>
    `;
  } else {
    document.getElementById('myStatsGrid').innerHTML = '';
  }

  if (!MY_LOG.length) {
    document.getElementById('myLogList').innerHTML = '<div class="empty">아직 기록된 공연이 없습니다</div>';
    return;
  }

  document.getElementById('myLogList').innerHTML = MY_LOG.map(l => {
    const perf = DATA?.perfs[l.perfNum];
    const actors = perf ? [...new Set(perf.cast.map(c=>c.actor))] : [];
    const chips = actors.slice(0,6).map(a=>`<span class="mylog-actor-chip">${a}</span>`).join('');
    return `<div class="mylog-item">
      <div class="mylog-perf">${l.perfNum}</div>
      <div class="mylog-info">
        <div class="mylog-date">${l.date||'날짜 미확인'} ${l.time||''}</div>
        ${l.memo?`<div class="mylog-memo">${l.memo}</div>`:''}
        ${chips?`<div class="mylog-actor-chips">${chips}</div>`:''}
      </div>
      <button class="mylog-del" onclick="deleteMyLog(${l.perfNum})">✕</button>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════
function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

function setSyncStatus(state) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot';
  if (state === 'live') {
    dot.classList.add('live');
    txt.textContent = new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
  } else if (state === 'loading') {
    txt.textContent = 'loading...';
  } else {
    txt.textContent = 'error';
  }
}

function openSettings() {
  // Reset to password gate every time
  document.getElementById('pwGate').style.display = 'block';
  document.getElementById('pwContent').style.display = 'none';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
  document.getElementById('settingsModal').classList.add('open');
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
}

function checkPw() {
  const val = document.getElementById('pwInput').value;
  if (val === 'aozlxks') {
    document.getElementById('pwGate').style.display = 'none';
    document.getElementById('pwContent').style.display = 'block';
    document.getElementById('sheetIdInput').value = CFG.sheetId;
    document.getElementById('castSheetName').value = CFG.castSheet;
    document.getElementById('actorSheetName').value = CFG.actorSheet;
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings() {
  CFG.sheetId = document.getElementById('sheetIdInput').value.trim();
  CFG.castSheet = document.getElementById('castSheetName').value.trim() || '캐스팅 기록';
  CFG.actorSheet = document.getElementById('actorSheetName').value.trim() || '배우 정보';
  localStorage.setItem('snm_sheetId', CFG.sheetId);
  localStorage.setItem('snm_castSheet', CFG.castSheet);
  localStorage.setItem('snm_actorSheet', CFG.actorSheet);
  closeSettings();
  loadData();
}

// Secret: click logo 5 times to open settings
(function initLogoSecret() {
  let clicks = 0, timer;
  document.getElementById('logoBtn').addEventListener('click', () => {
    clicks++;
    clearTimeout(timer);
    timer = setTimeout(() => { clicks = 0; }, 1500);
    if (clicks >= 5) { clicks = 0; openSettings(); }
  });
})();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeSettings();
    document.getElementById('detailOverlay').classList.remove('open');
  }
});

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
(function init() {
  renderMyLog(); // show empty state first
  if (CFG.sheetId) {
    loadData();
    setInterval(loadData, 5 * 60 * 1000); // auto-refresh every 5 min
  } else {
    // show setup prompt
    ['overview','actors','roles','milestones','schedule'].forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (el) el.innerHTML = `<div class="loading"><span class="spin"></span>시트 ID를 설정하면 데이터가 표시됩니다<br><br><button class="btn-add" onclick="openSettings()" style="margin-top:8px">⚙ 설정 열기</button></div>`;
    });
  }
})();
</script>
